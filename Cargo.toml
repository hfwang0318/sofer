[package]
name = "sofer"
version = "1.0.0"
edition = "2021"
description = "Offline OCR for code and terminal screenshots (macOS + Windows)"
license = "MIT"

[[bin]]
name = "sofer"
path = "src/main.rs"

[lib]
name = "sofer"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
