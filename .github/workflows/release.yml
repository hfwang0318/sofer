name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      # The runtime binaries are not committed (78 MB). The build downloads the
      # pinned b12018 Windows x64 CPU build and places it in the resource dir.
      - name: Fetch bundled llama.cpp runtime
        working-directory: app
        run: python scripts/fetch-runtime.py --platform windows-x64

      - name: Stage Visual C++ runtime
        working-directory: app
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/stage-vc-runtime.ps1

      - name: Smoke-test bundled llama runtime
        working-directory: app/src-tauri/runtime/windows-x64
        shell: pwsh
        run: ./llama-server.exe --version

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Test desktop backend
        working-directory: app/src-tauri
        run: cargo test

      # The release page must list the changes it ships; render the body from
      # CHANGELOG.md instead of keeping a copy in this workflow.
      - name: Render release notes from the changelog
        run: python scripts/release_body.py "${{ github.event.inputs.tag || github.ref_name }}" --out release-body.md

      - name: Build NSIS installer and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "sofer ${{ github.event.inputs.tag || github.ref_name }}"
          body_path: release-body.md
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: Show produced bundles
        if: always()
        shell: pwsh
        run: |
          if (Test-Path app/src-tauri/target/release/bundle) {
            Get-ChildItem app/src-tauri/target/release/bundle -Recurse -File |
              Select-Object FullName,Length | Format-Table -AutoSize
          }

  # Runs after Windows on purpose: tauri-action merges the platform entry into
  # the existing latest.json, so the two jobs must not write it concurrently.
  macos:
    name: macOS arm64 DMG
    runs-on: macos-latest
    needs: windows
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Fetch bundled llama.cpp runtime
        working-directory: app
        run: python3 scripts/fetch-runtime.py --platform macos-arm64

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Test desktop backend
        working-directory: app/src-tauri
        run: cargo test

      - name: Build DMG and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "sofer ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Show produced bundles
        if: always()
        run: |
          if [ -d app/src-tauri/target/aarch64-apple-darwin/release/bundle ]; then
            find app/src-tauri/target/aarch64-apple-darwin/release/bundle -type f -exec ls -lh {} \;
          fi
