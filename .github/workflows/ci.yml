name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # Warnings are errors: the kernel is shared by the CLI and the desktop
      # shell, and a clean clippy run is the only static gate either crate has.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # unit tests + the golden layout tests (they read bench/images + bench/truth,
      # so both platforms run the *same* geometry assertions on the same pixels)
      - run: cargo test --all-targets

      - run: cargo build --release

      - name: doctor
        shell: bash
        run: ./target/release/sofer doctor || true

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # The version is hand-written in three files; a release that updates one
      # of them ships an About page that disagrees with the updater feed.
      - name: Check version consistency
        run: python3 scripts/check-versions.py

      # Includes `tsc --noEmit` (strict + noUnused*) and the Vite build.
      - name: Type-check and build frontend
        working-directory: app
        run: pnpm build

      # Vitest + jsdom cover the pure lib logic (history, readiness, defaults).
      - name: Unit-test frontend logic
        working-directory: app
        run: pnpm test:run

      # The Tauri build script validates the platform resource path even for
      # `cargo test`, so the (gitignored) bundled runtime must exist.
      - name: Cache llama.cpp runtime
        uses: actions/cache@v4
        with:
          path: app/src-tauri/runtime
          key: llama-runtime-${{ runner.os }}-${{ hashFiles('app/scripts/fetch-runtime.py') }}

      - name: Fetch bundled llama.cpp runtime
        working-directory: app
        shell: bash
        run: |
          platform="${{ runner.os == 'macOS' && 'macos-arm64' || 'windows-x64' }}"
          if [ -f "src-tauri/runtime/$platform/VERSION" ]; then
            echo "runtime restored from cache: $platform"
          else
            python scripts/fetch-runtime.py
          fi

      # The desktop crate is not a workspace member, so the root job does not
      # compile or test it.
      - name: Formatting (desktop)
        working-directory: app/src-tauri
        run: cargo fmt -- --check

      - name: Clippy (desktop)
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test desktop backend
        working-directory: app/src-tauri
        run: cargo test

  e2e:
    name: app e2e
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: app
        run: pnpm exec playwright install chromium

      # Playwright starts `pnpm dev` (mock backend) through the webServer config,
      # so this covers the browser-preview flows without a model or permissions.
      - name: Browser preview flows
        working-directory: app
        run: pnpm e2e
